<div id="ble-pairing-explainer">
  <h3>What a passive sniffer receives</h3>
  <div class="viz-controls">
    <label class="form-label">Pairing
      <select class="form-select" id="ble-mode"><option value="legacy">Legacy Just Works — our capture</option><option value="secure">Secure Connections Just Works — comparison</option></select>
    </label>
    <label class="form-check"><input class="form-check-input" type="checkbox" id="ble-capture" checked><span class="form-check-label">Sniffer captured pairing from the start</span></label>
  </div>
  <div class="viz-row" style="margin:20px 0;justify-content:space-between" aria-label="Device roles">
    <strong>AIRSTEP</strong><span>← BLE →</span><strong>THR</strong><span>⋯ reception ⋯</span><strong>Sniffer</strong>
  </div>
  <table class="table"><thead><tr><th>Stage</th><th>Pedal and amplifier</th><th>Sniffer</th></tr></thead><tbody id="ble-rows"></tbody></table>
  <div aria-live="polite" id="ble-result" style="margin-top:16px;font-weight:500"></div>
  <div class="text-small" style="margin-top:12px">Mechanism comparison; real keys are not shown. Secure Connections was not tested on this THR.</div>
</div>
<script>
(()=>{
const root=document.getElementById('ble-pairing-explainer');
const mode=root.querySelector('#ble-mode'), capture=root.querySelector('#ble-capture');
const rows=root.querySelector('#ble-rows'), result=root.querySelector('#ble-result');
function draw(){
 const legacy=mode.value==='legacy', seen=capture.checked;
 const data=legacy ? [
 ['1. Inputs','TK = 0; random values exchanged',seen?'TK known; both random values captured':'TK known; pairing random values missed'],
 ['2. Deriving the STK','s1(TK, THR random, pedal random)',seen?'Can calculate the same STK':'Insufficient data for STK'],
 ['3. BLE encryption','Derive session key and enable AES-CCM',seen?'Recovers session key':'Cannot decrypt from the current capture alone'],
 ['4. Slot command','SysEx → BLE-MIDI → encrypted packet',seen?'Reads after decryption: “select slot”':'Sees encrypted payload']
 ] : [
 ['1. Inputs','Each peer has its own private key',seen?'Sees public keys and pairing exchange':'Pairing missed'],
 ['2. Shared secret','Calculate ECDH secret locally','No private keys; cannot derive secret'],
 ['3. BLE encryption','Derive LTK and session key from the secret','Passive capture is insufficient to derive the key'],
 ['4. Slot command','SysEx → BLE-MIDI → encrypted packet','Sees encrypted payload']
 ];
 rows.replaceChildren(...data.map(row=>{const tr=document.createElement('tr');for(const cell of row){const td=document.createElement('td');td.textContent=cell;tr.append(td);}return tr;}));
 result.textContent=legacy&&seen?'The link is encrypted, but the key can be recovered from captured pairing.':legacy?'Without pairing or previously known keys, this decryption method does not work.':'Secure Connections prevents this passive eavesdropping; Just Works still does not prevent an active intermediary.';
}
function change(){draw();if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{pairing:mode.value,capturedPairing:capture.checked}}).catch(()=>{});}
function restore(s){const v=s?.modelContent;if(v){mode.value=v.pairing==='secure'?'secure':'legacy';capture.checked=v.capturedPairing!==false;}draw();}
mode.addEventListener('change',change);capture.addEventListener('change',change);
window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
restore(window.openai?.widgetState);
})();
</script>
